apiVersion: apps/v1
kind: Deployment
metadata:
  name: kepta-api
  labels:
    app: kepta-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kepta-api
  template:
    metadata:
      labels:
        app: kepta-api
    spec:
      containers:
        - name: kepta-api
          image: ghcr.io/aldofunes/kepta/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: kepta-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kepta-api
spec:
  selector:
    app: kepta-api
  ports:
    - port: 80
      targetPort: 8080
