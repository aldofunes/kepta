apiVersion: apps/v1
kind: Deployment
metadata:
  name: kepta-worker
  labels:
    app: kepta-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kepta-worker
  template:
    metadata:
      labels:
        app: kepta-worker
    spec:
      containers:
        - name: kepta-worker
          image: ghcr.io/aldofunes/kepta/worker:latest
          envFrom:
            - secretRef:
                name: kepta-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
